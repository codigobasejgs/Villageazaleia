<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15462D" />
      <stop offset="55%" stop-color="#0D3823" />
      <stop offset="100%" stop-color="#061D12" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8A6B1A" />
    </linearGradient>

    <linearGradient id="pinkCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6090" />
      <stop offset="30%" stop-color="#E91E63" />
      <stop offset="85%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <linearGradient id="pinkSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F06292" />
      <stop offset="40%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#7B0D47" />
    </linearGradient>

    <linearGradient id="pinkBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#640837" />
    </linearGradient>

    <linearGradient id="greenBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E39" />
      <stop offset="50%" stop-color="#0D3823" />
      <stop offset="100%" stop-color="#061D12" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background: OS applies its own mask shape (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Azaleia flower, scaled + centered within the safe zone (~50% of canvas) -->
  <g transform="translate(96,96) scale(1.6)">
    <!-- BOTTOM PETAL / BASE WING -->
    <path d="M 50 135 C 75 160, 125 160, 150 135 C 130 148, 70 148, 50 135 Z" fill="url(#greenBorderGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 60 135 C 80 152, 120 152, 140 135 C 122 144, 78 144, 60 135 Z" fill="url(#pinkBottom)" />

    <!-- LOWER SIDE PETALS -->
    <path d="M 25 110 C 25 80, 75 75, 100 100 C 65 115, 35 125, 25 110 Z" fill="url(#greenBorderGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 33 107 C 35 86, 73 82, 92 101 C 65 112, 42 118, 33 107 Z" fill="url(#pinkSide)" />

    <path d="M 175 110 C 175 80, 125 75, 100 100 C 135 115, 165 125, 175 110 Z" fill="url(#greenBorderGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 167 107 C 165 86, 127 82, 108 101 C 135 112, 158 118, 167 107 Z" fill="url(#pinkSide)" />

    <!-- UPPER SIDE PETALS -->
    <path d="M 45 75 C 40 45, 85 45, 100 80 C 75 75, 55 70, 45 75 Z" fill="url(#greenBorderGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 52 72 C 48 51, 80 51, 94 77 C 75 73, 60 69, 52 72 Z" fill="url(#pinkSide)" />

    <path d="M 155 75 C 160 45, 115 45, 100 80 C 125 75, 145 70, 155 75 Z" fill="url(#greenBorderGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 148 72 C 152 51, 120 51, 106 77 C 125 73, 140 69, 148 72 Z" fill="url(#pinkSide)" />

    <!-- MAIN CENTRAL POINTED PETAL -->
    <path d="M 100 20 C 125 50, 130 90, 100 135 C 70 90, 75 50, 100 20 Z" fill="url(#greenBorderGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
    <path d="M 100 26 C 120 52, 123 87, 100 128 C 77 87, 80 52, 100 26 Z" fill="url(#pinkCenter)" />

    <!-- GOLD PISTILS / STAMENS -->
    <line x1="100" y1="115" x2="100" y2="60" stroke="#0D3823" stroke-width="2.5" />
    <circle cx="100" cy="58" r="5" fill="url(#goldGrad)" stroke="#061D12" stroke-width="1" />

    <path d="M 100 115 Q 92 90 88 70" stroke="#0D3823" stroke-width="2" fill="none" />
    <circle cx="88" cy="69" r="4" fill="url(#goldGrad)" stroke="#061D12" stroke-width="1" />

    <path d="M 100 115 Q 108 90 112 70" stroke="#0D3823" stroke-width="2" fill="none" />
    <circle cx="112" cy="69" r="4" fill="url(#goldGrad)" stroke="#061D12" stroke-width="1" />

    <path d="M 100 115 Q 82 98 76 82" stroke="#0D3823" stroke-width="2" fill="none" />
    <circle cx="76" cy="82" r="3.5" fill="url(#goldGrad)" stroke="#061D12" stroke-width="1" />

    <path d="M 100 115 Q 118 98 124 82" stroke="#0D3823" stroke-width="2" fill="none" />
    <circle cx="124" cy="82" r="3.5" fill="url(#goldGrad)" stroke="#061D12" stroke-width="1" />
  </g>
</svg>
